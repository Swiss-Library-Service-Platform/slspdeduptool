<!DOCTYPE html>
{% load static %}
<html>
<head>
	<title>One-time token letter</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="shortcut icon" type="image/png" href="{% static 'favicon.png' %}">
</head>
<body>
<div class="container py-4">
	<h1 class="mb-4">One-time token letter</h1>

	<p class="mb-4">
		Current status:
		{% if enabled %}
		<span class="badge bg-success">ACTIVE</span>
		{% else %}
		<span class="badge bg-secondary">INACTIVE</span>
		{% endif %}
	</p>

	<form method="post" class="card card-body" style="max-width: 560px;">
		{% csrf_token %}
		<label for="token" class="form-label">Token</label>
		<input type="text" id="token" name="token" class="form-control mb-3" placeholder="Enter a token">

		<button type="submit" class="btn btn-primary">
			Toggle letter status
		</button>
	</form>
</div>
</body>
</html>
